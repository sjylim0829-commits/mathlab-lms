<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영서중학교 수학 LMS | 임종윤 교사</title>
  <!-- Version: 1.0.2 -->
  <meta name="description" content="영서중학교 수학 교과 1~3학년(1~8반) 수업 진도 기록, 학생 기록 아카이빙 및 AI 세특 자동 생성 시스템">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Dynamic Atmosphere Background -->
  <div class="app-background">
    <div class="radial-glow"></div>
    <div class="math-grid-bg"></div>
    
    <!-- Floating Math Symbols SVG -->
    <svg class="floating-math-symbols" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <text x="90" y="190" font-size="140" opacity="0.8" transform="rotate(-10 90 190)">∑</text>
      <text x="1240" y="180" font-size="160" opacity="0.8" transform="rotate(8 1240 180)">∫</text>
      <text x="300" y="540" font-size="120" opacity="0.8" transform="rotate(0 300 540)">π</text>
      <text x="540" y="280" font-size="130" opacity="0.8" transform="rotate(-6 540 280)">√</text>
      <text x="170" y="700" font-size="110" opacity="0.8" transform="rotate(10 170 700)">∞</text>
      <text x="780" y="200" font-size="100" opacity="0.8" transform="rotate(0 780 200)">θ</text>
      <text x="1180" y="600" font-size="100" opacity="0.8" transform="rotate(0 1180 600)">≈</text>
      <text x="980" y="760" font-size="120" opacity="0.8" transform="rotate(6 980 760)">∂</text>
      <text x="620" y="760" font-size="110" opacity="0.8" transform="rotate(-8 620 760)">Δ</text>
      <text x="1320" y="400" font-size="90" opacity="0.8" transform="rotate(0 1320 400)">÷</text>
    </svg>
  </div>

  <!-- Main Shell Entrypoint -->
  <div id="app-root"></div>

  <!-- JavaScript Modules -->
  <script src="js/grapher.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/student.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
